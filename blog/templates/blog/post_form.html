{% load static %}
   <!DOCTYPE html>
   <html>
   <head>
       <title>{% if form.instance.id %}Edit Post{% else %}Create Post{% endif %}</title>
       <link rel="stylesheet" href="{% static 'blog/css/style.css' %}">
   </head>
   <body>
       <h1>{% if form.instance.id %}Edit Post{% else %}Create Post{% endif %}</h1>

           {{ form.as_p }}

       </form>
       <a href="{% url 'home' %}">Back to Home</a>
   </body>
   </html>
